name: silent_settings
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sound_mode: ^3.1.1
  flutter_volume_controller: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/Silent app logo design.png
    - assets/Gemini.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Silent app logo design.png"
  adaptive_icon_background: "#D8B4E2" # Matches your soft purple background color
  adaptive_icon_foreground: "assets/Silent app logo design.png"
  min_sdk_android: 21